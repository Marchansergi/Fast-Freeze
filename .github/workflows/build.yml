name: Compilar UWFManager.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin --name UWFManager run_uwf_manager.py
      - uses: actions/upload-artifact@v4
        with:
          name: UWFManager
          path: dist/UWFManager.exe
